name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # 30 而不是"看起来够"的 20：超时截断出来的失败是"没跑完"，既不是质量信号也没有诊断价值
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # 版本钉死但不写进 package.json 的 packageManager 字段：实测那样做会把 pnpm 自身
    # 写进 lockfile（+158 行各平台二进制），而本仓跑 --frozen-lockfile，平白多一份供应链面
    - name: Install pnpm
      run: |
        npm install -g pnpm@12.6.0
        pnpm --version

    # 不加 --ignore-scripts：workspace 链接由 postinstall 建，缺了它报「模块找不到」而非「链接没建」
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify
      run: pnpm verify

    # 单独一步：自检靠派生子进程跑副本门禁，而 Windows 上经 pnpm 链条派子进程会 EBUSY。
    # 留在 verify 里会让那条命令恒红 —— 一个需要人判断「这次红是不是环境」的门禁就不是门禁了
    - name: 门禁自检（注入违规看它是否还拦得住）
      run: pnpm run verify:selfcheck
