<script type="text/mermaid" data-title="4. 运行时数据流">
sequenceDiagram
    participant U as 用户/CI
    participant CLI as cli
    participant CFG as config
    participant H as host(Runner)
    participant P as core.plan
    participant T as target adapter
    participant R as 远端/本机

    U->>CLI: dp deploy project
    CLI->>CFG: 装载 + 合并 + 校验
    CFG-->>CLI: 生效配置
    CLI->>H: connect(hops) + probe
    H->>R: 加密隧道 · 认证 · 复合探测脚本
    R-->>H: Facts
    CLI->>P: plan(config, facts)
    P-->>CLI: steps（含 unwind 撤销项）
    CLI->>U: dry-run 预览
    U->>CLI: 确认 / --yes
    CLI->>H: acquire lock
    CLI->>T: install → activate
    T->>R: 写文件 · 渲染 conf · 原子切换
    CLI->>R: verify（HTTP / 容器 / nginx -t）
    alt 通过
        CLI->>R: finalize（reload · prune · release lock）
        CLI-->>U: exit 0
    else 失败
        CLI->>H: 逆序执行 unwind
        CLI-->>U: exit 2（并输出 trace）
    end
</script>

<script type="text/mermaid" data-title="15. 预检 → 事务 → 验收：三道门">
flowchart TB
    C1["连接 + Facts"] --> LOCK["取锁（预检期间唯一的写）"]
    LOCK --> PRE["① 预检：连接/加密 · 权限实证 · 磁盘 · 端口 · 依赖 · conf 冲突 · 架构"]
    PRE -->|FAIL| EXIT["解锁 · 零副作用 · exit 3/4"]
    PRE -->|PASS| PLAN["② plan + unwind（回滚计划）"]
    PLAN --> CG["③ 提交前复检：空间/可写/锁持有"]
    CG -->|FAIL| EXIT
    CG -->|PASS| DO["④ 实施（流式写入 .incoming → 校验 → rename）"]
    DO --> VER["⑤ 验收"]
    VER -->|失败| ROL["⑥ 逆序补偿 + 取证"]
    VER -->|通过| FIN["⑦ reload · prune · 解锁 · exit 0"]

    classDef gate fill:#422006,stroke:#f59e0b,color:#fef3c7
    classDef bad fill:#450a0a,stroke:#f87171,color:#fee2e2
    classDef good fill:#134e4a,stroke:#2dd4bf,color:#ccfbf1
    class PRE,CG,VER gate
    class EXIT,ROL bad
    class DO,FIN good
</script>

<script type="text/mermaid" data-title="16. 事务状态机">
stateDiagram-v2
    [*] --> Preparing
    Preparing --> Running: 快照完成 + 加锁成功
    Running --> Committing: 全部步骤成功
    Running --> Compensating: 任一步失败
    Committing --> Committed: 验收通过
    Committing --> Compensating: 验收失败
    Compensating --> RolledBack: 撤销全部成功
    Compensating --> NeedsHealing: 存在不可撤销项 / 撤销失败
    RolledBack --> [*]: exit 2
    Committed --> [*]: exit 0
    NeedsHealing --> [*]: 保留现场 + 告警 + 给出人工下一步
</script>

    SM --> SET["settle 窗口：稳定才能算数"]
    SET --> AG{"聚合"}
    AG -->|critical 失败| FAIL["整体失败 → 回滚"]
    AG -->|失败数 > maxFailed| FAIL
    AG -->|全部通过| OK["成功"]
    AG -->|少量失败且 quorum 允许| WARN["降级接受 + 显著告警"]

    classDef bad fill:#450a0a,stroke:#f87171,color:#fee2e2

    classDef warn fill:#422006,stroke:#f59e0b,color:#fef3c7
    class FAIL bad
    class OK good
    class WARN warn
</script>

    class NIGHT edge
</script>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'

const STORE = 'dp-diagrams-v1'
const statusEl = document.getElementById('status')
const navEl = document.getElementById('nav')
const cardsEl = document.getElementById('cards')

mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  securityLevel: 'loose',
  flowchart: { curve: 'basis', htmlLabels: true },
  themeVariables: { fontFamily: 'system-ui, "Microsoft YaHei", sans-serif' }
})

const saved = readSaved()
const sources = [...document.querySelectorAll('script[type="text/mermaid"]')]
  .map((el, i) => {
    const id = 'd' + (i + 1)
    return { id, title: el.dataset.title || ('图 ' + (i + 1)), src: (el.textContent || '').trim() }
  })

let uid = sources.length + 1

function readSaved() {
  try { return JSON.parse(localStorage.getItem(STORE) || '{}') } catch { return {} }
}
function writeSaved() {
  const obj = {}
  for (const c of collect()) obj[c.id] = { title: c.title, src: c.src }
  try { localStorage.setItem(STORE, JSON.stringify(obj)) } catch {}
}
function collect() {
  return [...cardsEl.querySelectorAll('.card')].map(card => ({
    id: card.dataset.id,
    title: card.querySelector('.title-input').value,
    src: card.querySelector('textarea').value
  }))
}

function build() {
  const items = sources.concat(extraItems())
  cardsEl.innerHTML = ''
  navEl.innerHTML = ''
  let n = 0
  for (const item of items) {
    n++
    const card = document.createElement('section')
    card.className = 'card'
    card.dataset.id = item.id
    card.innerHTML = `
      <header>
        <span class="n">${String(n).padStart(2, '0')}</span>
        <input class="title-input" value="${escapeAttr(item.title)}" />
        <span class="btns">
          <button class="mini" data-act="render">渲染</button>
          <button class="mini" data-act="toggle">编辑器</button>
          <button class="mini" data-act="copy">复制</button>
          <button class="mini" data-act="svg">SVG</button>
          <button class="mini" data-act="del">删除</button>
        </span>
      </header>
      <div class="body">
        <textarea spellcheck="false"></textarea>
        <div class="preview"></div>
      </div>`
    card.querySelector('textarea').value = item.src
    cardsEl.appendChild(card)

    const navBtn = document.createElement('button')
    navBtn.innerHTML = '<span class="n">' + String(n).padStart(2, '0') + '</span>' + escapeHtml(item.title)
    navBtn.addEventListener('click', () => {
      card.scrollIntoView({ behavior: 'smooth', block: 'start' })
      setActiveNav(navBtn)
    })
    navEl.appendChild(navBtn)

    bindCard(card)
    render(card)
  }
  syncNavTitles()
}

function extraItems() {
  const known = new Set(sources.map(s => s.id))
  return Object.entries(saved)
    .filter(([k]) => !known.has(k))
    .map(([k, v]) => ({ id: k, title: v.title || '自定义图', src: v.src || 'flowchart LR\n    A --> B' }))
}

function syncNavTitles() {
  const titles = collect().map(c => c.title)
  ;[...navEl.querySelectorAll('button')].forEach((b, i) => {
    b.innerHTML = '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>' + escapeHtml(titles[i] || '')
  })
}
function setActiveNav(btn) {
  ;[...navEl.querySelectorAll('button')].forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
}
function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;') }

async function render(card) {
  const code = card.querySelector('textarea').value
  const preview = card.querySelector('.preview')
  const rid = 'r-' + card.dataset.id + '-' + Math.random().toString(36).slice(2, 8)
  try {
    const { svg } = await mermaid.render(rid, code)
    preview.innerHTML = svg
    statusEl.textContent = '就绪'
  } catch (e) {
    preview.innerHTML = '<pre class="err">' + escapeHtml(e && e.message ? e.message : String(e)) + '</pre>'
    statusEl.textContent = '有图出错（见红色提示）'
  }
}

let timer
function bindCard(card) {
  const ta = card.querySelector('textarea')
  ta.addEventListener('input', () => {
    clearTimeout(timer)
    timer = setTimeout(() => { render(card); writeSaved(); syncNavTitles() }, 450)
  })
  card.querySelector('.title-input').addEventListener('input', () => { writeSaved(); syncNavTitles() })
  card.addEventListener('click', e => {
    const btn = e.target.closest('.mini')
    if (!btn) return
    const act = btn.dataset.act
    if (act === 'render') render(card)
    if (act === 'toggle') card.querySelector('.body').classList.toggle('collapsed-editor')
    if (act === 'copy') navigator.clipboard?.writeText(card.querySelector('textarea').value)
    if (act === 'svg') downloadSVG(card)
    if (act === 'del') {
      card.remove()
      delete saved[card.dataset.id]
      writeSaved()
      build()
    }
  })
}

function downloadSVG(card) {
  const svg = card.querySelector('.preview svg')
  if (!svg) return
  const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = (card.querySelector('.title-input').value || 'diagram') + '.svg'
  a.click()
  URL.revokeObjectURL(a.href)
}

document.getElementById('btn-render').addEventListener('click', () => {
  ;[...cardsEl.querySelectorAll('.card')].forEach(render)
})
document.getElementById('btn-toggle-all').addEventListener('click', () => {
  const bodies = [...cardsEl.querySelectorAll('.body')]
  const anyOpen = bodies.some(b => !b.classList.contains('collapsed-editor'))
  bodies.forEach(b => b.classList.toggle('collapsed-editor', anyOpen))
})
document.getElementById('btn-new').addEventListener('click', () => {
  const id = 'custom-' + uid++
  saved[id] = { title: '自定义图', src: 'flowchart LR\n    起点 --> 终点' }
  writeSaved()
  build()
})
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('恢复所有图为初始源码？（你的编辑会丢失）')) return
  localStorage.removeItem(STORE)
  for (const k of Object.keys(saved)) delete saved[k]
  build()
})
document.getElementById('btn-export').addEventListener('click', () => {
  const md = collect().map(c => '## ' + c.title + '\n\n```mermaid\n' + c.src + '\n```\n').join('\n')
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'diagrams.md'
  a.click()
  URL.revokeObjectURL(a.href)
})

build()
</script>
</body>
</html>
